<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="css/style-app.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button>
                <img src="assets/images/search.png" alt="search">
            </button>  
        </div>
        <div class="error">
            <p>Invalid City</p>
        </div>

        <div class="weather">
            <img src="assets/images/clouds.png" alt="clouds" class="weather-icon">
            <h1 class="temp">7C</h1>
            <h2 class="city">new york</h2>

            <div class="details">
               <div class="col">
                    <img src="assets/images/humidity.png" alt="humidity">
                    <div class="col-tee">
                        <p class="humidity">20%</p>
                        <p class="marg">Humidity</p>
                    </div>
               </div>
                <div class="col">
                    <img src="assets/images/wind.png" alt="wind">
                    <div class="col-tee">
                        <p class="wind">15.6 Km/hr</p>
                        <p class="marg">Wind Speed</p>
                    </div>
               </div>
        </div>
    </div>

    <script type="module" src="js/script-app.js"></script>
</body>
</html>
